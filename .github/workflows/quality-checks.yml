name: Code Quality Checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, edited]

jobs:
  changes:
    name: Detect docs-only change
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      core: ${{ steps.diff.outputs.core }}
      poc: ${{ steps.diff.outputs.poc }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect docs-only change
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          core=true
          poc=true
          code=true
          if [ "$EVENT_NAME" = "pull_request" ] \
            && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ] \
            && changed=$(git diff --no-renames --name-only "$BASE_SHA..$HEAD_SHA"); then
            if [ -n "$changed" ]; then
              core=false
              poc=false
              # Case order matters: .github/instructions/*.md precedes .github/* (which precedes *.md); specific files precede tests/* and docs.
              while IFS= read -r path; do
                case "$path" in
                  .github/instructions/*.md) ;;
                  .github/*|.claude/scripts/*|pyproject.toml|uv.lock|.pre-commit-config.yaml|tests/conftest.py|conftest.py|tests/__init__.py|.python-version|scripts/*)
                    core=true; poc=true ;;
                  tests/poc/fixtures/raw_job_description.md)
                    core=true; poc=true ;;
                  docs/dev-note/poc/expected_output_schema.json)
                    poc=true ;;
                  .claude/hooks/*)
                    core=true ;;
                  src/poc/*|src/preprocessing/*|src/id_generation/*|src/parsers/*|src/__init__.py)
                    core=true; poc=true ;;
                  tests/poc/*)
                    poc=true ;;
                  tests/*)
                    core=true ;;
                  *.md|docs/*|LICENSE*|.claude/*|.secrets.baseline) ;;
                  *)
                    core=true ;;
                esac
              done <<< "$changed"
              code=false
              if [ "$core" = true ] || [ "$poc" = true ]; then
                code=true
              fi
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "core=$core" >> "$GITHUB_OUTPUT"
          echo "poc=$poc" >> "$GITHUB_OUTPUT"

  quality:
    name: Quality Assurance
    runs-on: ubuntu-latest
    needs: changes
    strategy:
      matrix:
        python-version: ["3.12"]
    # UV_PYTHON overrides .python-version (pinned to 3.12) so every uv call uses the matrix interpreter.
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Install dependencies with uv
        if: needs.changes.outputs.code == 'true'
        run: uv sync --all-extras && uv run python --version

      - name: Download spaCy model
        if: needs.changes.outputs.code == 'true'
        run: uv run python -m spacy download en_core_web_md

      - name: Validate pre-commit config
        run: uv run pre-commit validate-config

      - name: Run pre-commit hooks
        if: needs.changes.outputs.code == 'true'
        run: uv run pre-commit run --all-files

      - name: Run docs-only pre-commit hooks
        if: needs.changes.outputs.code == 'false'
        # Pinned to the uv.lock pre-commit version so hook behaviour matches the full run.
        run: |
          for h in trailing-whitespace end-of-file-fixer detect-secrets; do
            uvx pre-commit@4.7.0 run "$h" --all-files || exit 1
          done

      - name: Scoped commented-out-code check (ERA001)
        if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
        run: uv run ruff check --select ERA001 src tests --output-format=concise

      - name: Check added comments (WHY-only)
        if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mapfile -t files < <(git diff --name-only --no-ext-diff --no-textconv --diff-filter=AM "$BASE_SHA"...HEAD -- 'src/*.py' 'tests/*.py')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed src/tests Python files; skipping added-comment check."
            exit 0
          fi
          uv run python scripts/check_added_comments.py --base-ref "$BASE_SHA" "${files[@]}"

      - name: Run type checking
        if: needs.changes.outputs.code == 'true'
        run: uv run mypy src/ tests/

      - name: Run tests with coverage
        if: needs.changes.outputs.core == 'true'
        run: |
          export PYTHONPATH="${{ github.workspace }}/src:$PYTHONPATH"
          uv run pytest tests/ -v --ignore=tests/poc -m "not perf" --cov=src -n auto --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codecov
        if: needs.changes.outputs.core == 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Run performance tests (serial, advisory)
        id: perf
        if: needs.changes.outputs.core == 'true'
        # Wall-clock budget tests run alone, without xdist or coverage, so CPU contention
        # does not flake them. Advisory: failures are reported but do not fail the job (#570).
        continue-on-error: true
        run: |
          export PYTHONPATH="${{ github.workspace }}/src:$PYTHONPATH"
          uv run pytest tests/ -v --ignore=tests/poc -m perf -n 0 --no-cov

      - name: Surface advisory perf test failure
        if: always() && needs.changes.outputs.core == 'true' && steps.perf.outcome == 'failure'
        run: |
          {
            echo "### Advisory perf tests failed"
            echo ""
            echo "Python ${{ matrix.python-version }}: see the 'Run performance tests' step. Job conclusion unchanged (advisory)."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=Advisory perf tests failed::Python ${{ matrix.python-version }}: see the 'Run performance tests' step"

  quality-poc:
    name: Quality Assurance (poc)
    runs-on: ubuntu-latest
    needs: changes
    strategy:
      matrix:
        python-version: ["3.12"]
    # UV_PYTHON overrides .python-version (pinned to 3.12) so every uv call uses the matrix interpreter.
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - name: Install dependencies with uv
        if: needs.changes.outputs.code == 'true'
        run: uv sync --all-extras && uv run python --version

      - name: Download spaCy model
        if: needs.changes.outputs.code == 'true'
        run: uv run python -m spacy download en_core_web_md

      - name: Run poc tests with coverage
        if: needs.changes.outputs.poc == 'true'
        run: |
          export PYTHONPATH="${{ github.workspace }}/src:$PYTHONPATH"
          uv run pytest tests/poc/ -v --cov=src -n auto --cov-report=xml

      - name: Upload poc coverage to Codecov
        if: needs.changes.outputs.poc == 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.xml
          flags: unittests-poc
          name: codecov-umbrella-poc
          fail_ci_if_error: false
